<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brain PL</title>
  <meta name="description" content="Wiadomości i wiedza ogólna zamiast bezmyślnego scrollowania.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-title" content="Daily Brain PL">
  <meta name="theme-color" content="#151A23">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preload" href="bricolage-grotesque-latin-ext-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>html,body{background:#151A23;color-scheme:dark}</style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scroller">
  <main id="app">
    <div class="pull" id="pull" aria-hidden="true"><span>Pociągnij, aby odświeżyć</span></div>

    <!-- Nachrichten -->
    <section class="view" id="view-news" aria-labelledby="news-title">
      <header class="page-head">
        <h1 id="news-title">Wiadomości</h1>
        <p class="page-sub" id="news-sub">Ładowanie</p>
      </header>

      <div class="news-tools">
        <div class="segmented" role="tablist" aria-label="Obszar">
          <button role="tab" data-cat="alle" aria-selected="true">Wszystkie</button>
          <button role="tab" data-cat="polska" aria-selected="false">Polska</button>
          <button role="tab" data-cat="swiat" aria-selected="false">Świat</button>
        </div>
        <div class="chips topics" id="news-topics" data-section="news" role="radiogroup" aria-label="Temat"></div>
        <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="news-search" type="search" placeholder="Przeszukaj wiadomości" autocomplete="off" enterkeyhint="search">
        </label>
        <button class="lang-btn" type="button" aria-label="Zmień język artykułów">Wszystkie</button>
      </div>
      </div>

      <div id="news-list" class="news-list feed-list" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </section>


    <!-- Lesen -->
    <section class="view" id="view-lesen" aria-labelledby="lesen-title" hidden>
      <header class="page-head">
        <h1 id="lesen-title">Czytaj</h1>
        <p class="page-sub" id="lesen-sub">Wiedza do czytania i rozwijania się</p>
      </header>

      <div class="news-tools">
        <div class="chips topics" id="lesen-topics" data-section="lesen" role="radiogroup" aria-label="Temat"></div>
        <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="lesen-search" type="search" placeholder="Przeszukaj artykuły" autocomplete="off" enterkeyhint="search">
        </label>
        <button class="lang-btn" type="button" aria-label="Zmień język artykułów">Wszystkie</button>
      </div>
      </div>

      <div id="lesen-list" class="news-list feed-list" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </section>

    <!-- Lernen -->
    <section class="view" id="view-learn" aria-labelledby="learn-title" hidden>
      <header class="page-head">
        <h1 id="learn-title">Nauka</h1>
        <p class="page-sub" id="learn-sub"></p>
      </header>

      <div class="streak" id="streak"></div>

      <div class="modes first" id="deck-row"></div>

      <h2 class="section-title">Wiedza i historia</h2>
      <div class="modes" id="modes-know"></div>
      <div class="modes" id="atlas-row"></div>

      <h2 class="section-title">Quiz o świecie</h2>
      <div class="chips" id="regions" role="radiogroup" aria-label="Region"></div>
      <div class="modes" id="modes"></div>

      <h2 class="section-title">Mapa wiedzy</h2>
      <p class="page-sub" id="know-sub"></p>
      <div class="mapbox kn" id="know-map"></div>
    </section>
  </main>
  </div>

  <!-- Quiz (Vollbild) -->
  <div class="quiz" id="quiz" hidden role="dialog" aria-modal="true" aria-label="Quiz">
    <div class="quiz-top">
      <button class="icon-btn" id="quiz-close" aria-label="Zakończ quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <ol class="dots" id="quiz-dots" aria-label="Postęp"></ol>
      <span class="quiz-count" id="quiz-count"></span>
    </div>
    <div class="chips quiz-modes" id="quiz-modes" role="radiogroup" aria-label="Zmień grę"></div>
    <div class="quiz-body" id="quiz-body"></div>
  </div>

  <!-- Profile und Atlas -->
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Szczegóły">
    <div class="sheet-top">
      <button class="icon-btn" id="sheet-back" aria-label="Wstecz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span id="sheet-title"></span>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <nav class="tabbar" aria-label="Nawigacja główna">
    <button data-tab="news" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="15" rx="2"/><path d="M16.5 8.5h3a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2h-2M7 9h6M7 12.5h6M7 16h4"/></svg>
      <span>Wiadomości</span>
    </button>
    <button data-tab="lesen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg>
      <span>Czytaj</span>
    </button>
    <button data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><path d="M3.5 12h17"/></svg>
      <span>Nauka</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
